# NVIDIA headless (RTX 3060) - fake connected DFP-1 (DisplayPort) for Sunshine/Steam.
# 2026-10-13: retargeted from DFP-0 (HDMI) to DFP-1 (unused DP) so the host's
# HDMI console (Proxmox) keeps working while the container holds a virtual
# 1920x1080 display. 60 Hz mode listed first: ConnectedMonitor forcing caps
# the pixel clock near 165 MHz on current drivers, so the 285 MHz 120 Hz
# modeline may fail validation. Previous config backed up next to this file.
Section "ServerLayout"
  Identifier "layout"
  Screen 0 "nvidia"
EndSection
Section "Monitor"
  Identifier "dp0mon"
  HorizSync 30.0-160.0
  VertRefresh 50.0-150.0
  # CVT-R modeline for 1920x1080 @ ~120 Hz (kept for reference; may not validate)
  Modeline "1920x1080R"  285.25  1920 1968 2000 2080  1080 1083 1088 1144 +hsync -vsync
  Modeline "1920x1080_60.00" 173.00  1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
  Option "PreferredMode" "1920x1080R"
EndSection
Section "Device"
  Identifier "nvidia"
  Driver "nvidia"
  BusID "PCI:10:0:0"
  Option "AllowEmptyInitialConfiguration" "true"
  Option "ConnectedMonitor" "DFP-1"
  Option "UseDisplayDevice" "DFP-1"
  Option "UseEDID" "FALSE"
  Option "ModeValidation" "AllowNonEdidModes"
  Option "MetaModes" "DFP-1: 1920x1080_60.00"
EndSection
Section "Screen"
  Identifier "nvidia"
  Device "nvidia"
  Monitor "dp0mon"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1920x1080_60.00" "1920x1080R"
    Virtual 1920 1080
  EndSubSection
EndSection
